trigger:
- main

pool:
  name: Local-Windows-Agent

steps:
- powershell: |
    $terraform = "C:\Terraform\terraform.exe"

    if (!(Test-Path $terraform)) {
        Write-Error "Terraform not found at $terraform"
        exit 1
    }

- task: AzureCLI@2
  displayName: 'Azure Login and Terraform Init'
  inputs:
    azureSubscription: 'sc-azure-terraform'
    scriptType: 'ps'
    scriptLocation: 'inlineScript'
    inlineScript: |
      az account show
      terraform init

- powershell: |
    & "C:\Tools\Terraform\terraform.exe" validate
  displayName: 'Terraform Validate'

- powershell: |
    & "C:\Tools\Terraform\terraform.exe" plan
  displayName: 'Terraform Plan'