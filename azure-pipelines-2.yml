
trigger:
  - main

pool:
  name: 'local-windows-Agent'

steps:
  - checkout: self

  - task: AzureCLI@2
    displayName: 'Azure Login'
    inputs:
      azureSubscription: 'sc-azure-terraform'
      scriptType: 'ps'
      scriptLocation: 'inlineScript'
      inlineScript: |
        az account show

  - task: PowerShell@2
    displayName: 'Terraform Init'
    inputs:
      targetType: 'inline'
      script: |
        & "C:\Terraform\terraform.exe" init

  - task: PowerShell@2
    displayName: 'Terraform Validate'
    inputs:
      targetType: 'inline'
      script: |
        & "C:\Terraform\terraform.exe" validate

  - task: PowerShell@2
    displayName: 'Terraform Plan'
    inputs:
      targetType: 'inline'
      script: |
        & "C:\Terraform\terraform.exe" plan
