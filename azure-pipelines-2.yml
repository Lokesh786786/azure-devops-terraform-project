
trigger:
  - main

pool:
  name: 'local-windows-Agent'  # Replace with your Agent Pool name

steps:
  - checkout: self

  - task: AzureCLI@2
    displayName: 'Azure Login'
    inputs:
      azureSubscription: 'sc-azure-terraform'
      scriptType: 'ps'
      scriptLocation: 'inlineScript'
      inlineScript: |
        az account show

  - task: PowerShell@2
    displayName: 'Terraform Init'
    inputs:
      targetType: 'inline'
      script: |
        terraform init

  - task: PowerShell@2
    displayName: 'Terraform Validate'
    inputs:
      targetType: 'inline'
      script: |
        terraform validate

  - task: PowerShell@2
    displayName: 'Terraform Plan'
    inputs:
      targetType: 'inline'
      script: |
        terraform plan
