# Azure DevOps pipeline - Windows self-hosted agent
trigger:
  branches:
    include:
      - main

pool:
  name: Local-Windows-Agent

variables:
  TF_ROOT: '$(Build.SourcesDirectory)'

steps:
  - checkout: self
    displayName: 'Checkout GitHub repository'

  - powershell: |
      Write-Host "Running on Windows self-hosted agent"
      Write-Host "Computer: $env:COMPUTERNAME"
      terraform version
    workingDirectory: '$(TF_ROOT)'
    displayName: 'Check Windows agent and Terraform'

  - powershell: |
      terraform fmt -check -recursive
    workingDirectory: '$(TF_ROOT)'
    displayName: 'Terraform format check'

  - powershell: |
      terraform init -backend=false
    workingDirectory: '$(TF_ROOT)'
    displayName: 'Terraform init (validation only)'

  - powershell: |
      terraform validate
    workingDirectory: '$(TF_ROOT)'
    displayName: 'Terraform validate'